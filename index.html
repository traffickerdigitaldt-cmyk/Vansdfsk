<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DFSK Vans · Cuéntanos de tus clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1f7;--card:#fff;--ink:#16121c;--muted:#6a6475;--line:#e3dfea;--chip:#f1eef6;--red:#e10600;--org:#ff7a1a;--pur:#4b1f78;--brand:#16121c;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b13;--card:#181320;--ink:#f2eef8;--muted:#a69fb4;--line:#2c2538;--chip:#231c2e;--brand:#ff7a1a;--on:#16121c}}
:root[data-theme="dark"]{--bg:#0e0b13;--card:#181320;--ink:#f2eef8;--muted:#a69fb4;--line:#2c2538;--chip:#231c2e;--brand:#ff7a1a;--on:#16121c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Poppins,"Segoe UI",system-ui,sans-serif}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top div{max-width:780px;margin:0 auto;padding:10px 16px}
.top span{font-size:13px;color:var(--muted);font-weight:500}
.track{height:8px;border-radius:4px;background:var(--chip);margin-top:6px;overflow:hidden}
.track b{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--red),var(--org));transition:width .3s}
main{max-width:780px;margin:0 auto;padding:16px 16px 60px}
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:0;background:radial-gradient(circle at 88% 18%,rgba(255,122,26,.55),transparent 28%),linear-gradient(135deg,#0d0a12 0%,#2a1245 60%,#4b1f78 100%)}
.hero .pic{position:relative;height:300px;background:#0d0a12}
.hero .pic img{width:100%;height:100%;object-fit:cover;object-position:center 62%;display:block}
.hero .pic::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(13,10,18,.92))}
.hero .pic svg.logo{position:absolute;left:20px;top:18px;z-index:2;margin:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.hero .txt{padding:6px 24px 28px;position:relative;z-index:1;margin-top:-34px}
.hero svg.logo{height:42px;width:auto;color:#fff;display:block;margin-bottom:18px;position:relative;z-index:1}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;position:relative;z-index:1}
.hero h1{margin:0 0 10px;font-size:27px;line-height:1.2;font-weight:800;position:relative;z-index:1;max-width:520px}
.hero p{margin:0;font-size:15px;opacity:.93;max-width:500px;position:relative;z-index:1}
.promise{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 0}
.promise div{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.promise b{display:block;font-size:14px;margin-bottom:2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:18px;overflow:hidden}
.sec>h2{margin:0;padding:16px 20px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--red) 10%,var(--card)),var(--card))}
.sec>h2 i{font-style:normal;flex:none;width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:17px}
.sec.fun>h2{background:linear-gradient(90deg,color-mix(in srgb,var(--org) 22%,var(--card)),var(--card))}
.sec.fun>h2 i{background:var(--org)}
.sec .intro{margin:0;padding:12px 20px 0;color:var(--muted);font-size:14px}
.q{padding:18px 20px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.qt{display:flex;gap:12px;margin-bottom:12px}
.qt .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.qt b{display:block;font-size:16px;line-height:1.35;font-weight:600}
.qt small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;transition:transform .12s,background .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.fun .chip.on{background:var(--org);border-color:var(--org);color:#16121c}
input[type=text],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--org);outline-offset:1px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.range{padding:6px 2px}
.range input{width:100%;accent-color:var(--org);height:30px}
.range .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500}
.range .val{text-align:center;font-weight:700;font-size:15px;margin-top:2px;min-height:24px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.btn{padding:14px 22px;border-radius:14px;border:2px solid var(--red);background:var(--red);color:#fff;font:700 15px Poppins,sans-serif;cursor:pointer}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line);font-weight:600}
.note{color:var(--muted);font-size:13.5px}
.thanks{margin-top:18px;border-radius:18px;padding:22px;text-align:center;background:linear-gradient(135deg,#0d0a12,#2a1245);color:#fff}
.thanks b{font-size:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--card);padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.hero .pic{height:230px}.pair{grid-template-columns:1fr}.hero h1{font-size:23px}}
#print{display:none}
@media print{
 @page{margin:14mm}
 body>*:not(#print){display:none!important}
 body{background:#fff}
 #print{display:block;color:#111;font:12px/1.5 Poppins,Arial,sans-serif}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ph{background:linear-gradient(135deg,#0d0a12,#4b1f78);color:#fff;padding:16px 18px;border-radius:12px}
 .ph .pp{width:100%;height:150px;object-fit:cover;object-position:center 62%;border-radius:8px;margin-bottom:10px;display:block}
 .ph svg{height:30px;width:auto;color:#fff;display:block;margin-bottom:8px}
 .ph h1{margin:0;font-size:19px}.ph p{margin:3px 0 0;font-size:11.5px;opacity:.9}
 .pm{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin:10px 0;font-size:11.5px}
 .pm div{border:1px solid #d6d0e0;border-radius:6px;padding:5px 8px}.pm b{display:block;font-size:10px;color:#666;text-transform:uppercase}
 .ps{margin-top:12px}
 .ps h2{font-size:14px;margin:0 0 6px;padding:5px 10px;background:#f1eef6;border-left:5px solid #e10600;break-after:avoid}
 .ps.fun h2{border-left-color:#ff7a1a}
 .pq{break-inside:avoid;padding:6px 0;border-bottom:1px solid #e8e4ee}
 .pq b{display:block;font-size:12px}.pq p{margin:2px 0 0;white-space:pre-wrap}
 .pq i{color:#999}
 .pf{margin-top:14px;font-size:10.5px;color:#888;text-align:center}
}
</style></head>

{id:'frase',t:'¿Qué frase de un cliente debería escuchar toda la audiencia?',h:'Una que resuma su sueño, su lucha o su orgullo.',type:'area',ph:'"Con esta van por fin me tomé en serio mi negocio..."'},
{id:'testi',t:'¿Tienes algún cliente que aceptaría grabar un testimonio?',type:'one',o:['Sí, tengo clientes dispuestos','Quizás','No por ahora']},
{id:'restr',t:'¿Hay algo que NO se puede decir o mostrar?',h:'Opcional. Restricciones de la marca o legales.',type:'text',opt:1,ph:'Ej: no mencionar precios'}]}];
var S={};
try{S=JSON.parse(localStorage.getItem('dfsk-vans')||'{}')}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function got(q){if(q.type=='trio')return [1,2,3].some(function(i){return S['obj'+i+'a']||S['obj'+i+'b']});
var v=S[q.id];return !!((Array.isArray(v)&&v.length)||(!Array.isArray(v)&&v!=null&&v!=='')||S[q.id+'_t'])}
function rv(q){return (S[q.id]!=null&&S[q.id]!=='')?q.l[S[q.id]-1]:''}
function qh(q,n){var h='<div class="q"><div class="qt"><span class="n">'+n+'</span><div><b>'+q.t+'</b>'+(q.h?'<small>'+q.h+'</small>':'')+'</div></div>';
if(q.type=='chips'||q.type=='one'){h+='<div class="chips">'+q.o.map(function(v){return '<button type="button" class="chip'+((S[q.id]||[]).indexOf(v)>-1?' on':'')+'" data-k="'+q.id+'" data-v="'+esc(v)+'" data-one="'+(q.type=='one'?1:0)+'">'+v+'</button>'}).join('')+'</div>';
if(q.ph)h+=q.type=='one'?'<input type="text" data-t="'+q.id+'_t" placeholder="'+esc(q.ph)+'" value="'+esc(S[q.id+'_t'])+'">':'<textarea data-t="'+q.id+'_t" placeholder="'+esc(q.ph)+'">'+esc(S[q.id+'_t'])+'</textarea>'}
else if(q.type=='text')h+='<input type="text" data-t="'+q.id+'" placeholder="'+esc(q.ph)+'" value="'+esc(S[q.id])+'">';
else if(q.type=='area')h+='<textarea data-t="'+q.id+'" placeholder="'+esc(q.ph)+'">'+esc(S[q.id])+'</textarea>';
else if(q.type=='range')h+='<div class="range"><input type="range" min="1" max="5" step="1" value="'+(S[q.id]||3)+'" data-r="'+q.id+'"><div class="lb"><span>'+q.lo+'</span><span>'+q.hi+'</span></div><div class="val" id="rv">'+rv(q)+'</div></div>';
else if(q.type=='trio')for(var i=1;i<4;i++)h+='<div class="pair"><input type="text" data-t="obj'+i+'a" placeholder="Objeción '+i+': lo que dice" value="'+esc(S['obj'+i+'a'])+'"><input type="text" data-t="obj'+i+'b" placeholder="Tu respuesta" value="'+esc(S['obj'+i+'b'])+'"></div>';
return h+'</div>'}
function render(){var n=0;
document.getElementById('app').innerHTML='<div class="hero"><div class="pic"><img src="'+VAN+'" alt="Van DFSK decorada para Halloween">'+LOGO+'</div><div class="txt"><span class="tag">🎃 Especial Halloween · Vans</span><h1>Ayúdanos a contar la historia de tus clientes</h1><p>Mañana grabamos con nuestra van decorada. Tus respuestas se vuelven un video que conecta con verdad, y tus ideas también cuentan.</p></div></div>'+
'<div class="promise"><div><b>⏱ 8 a 10 minutos</b>Responde con lo que ya sabes.</div><div><b>💾 Se guarda solo</b>Puedes seguir luego.</div><div><b>📋 Copia o descarga</b>En texto o en PDF.</div></div>'+
SEC.map(function(sec){return '<section class="sec'+(sec.fun?' fun':'')+'"><h2><i>'+sec.i+'</i>'+sec.t+'</h2>'+(sec.intro?'<p class="intro">'+sec.intro+'</p>':'')+sec.q.map(function(q){n++;return qh(q,n)}).join('')+'</section>'}).join('')+
'<div class="thanks"><b>¡Gracias! 🙌</b><p style="margin:6px 0 0;font-size:14px;opacity:.9">Lo que cuentas hoy es lo que hace que el video de mañana se sienta real.</p></div>'+
'<div class="act"><button type="button" class="btn" id="copy">📋 Copiar respuestas</button><button type="button" class="btn dark" id="pdf">⬇ Descargar PDF</button><button type="button" class="btn alt" id="clr">Borrar todo</button></div><p class="note">Para el PDF, en la ventana de impresión elige "Guardar como PDF". Tus respuestas se guardan en este dispositivo mientras escribes.</p>';
prog()}
function prog(){var t=0,d=0;SEC.forEach(function(s){s.q.forEach(function(q){if(!q.opt){t++;if(got(q))d++}})});
document.getElementById('pt').textContent=d+' de '+t+' preguntas respondidas'+(d==t?' · ¡listo! 🎉':'');document.getElementById('pb').style.width=(100*d/t)+'%'}
function save(){try{localStorage.setItem('dfsk-vans',JSON.stringify(S))}catch(e){}}
function ans(q){var h='';
if(q.type=='trio'){[1,2,3].forEach(function(i){if(S['obj'+i+'a']||S['obj'+i+'b'])h+='Objeción '+i+': '+(S['obj'+i+'a']||'-')+'\nRespuesta: '+(S['obj'+i+'b']||'-')+'\n'})}
else if(q.type=='range')h=rv(q);
else{var v=S[q.id];h=Array.isArray(v)?v.join(', '):(v||'');var t=S[q.id+'_t'];if(t)h+=(h?'\n':'')+t}
return h.trim()}
function plain(){var n=0,o='INVESTIGACIÓN DEL CLIENTE · DFSK VANS · VIDEO HALLOWEEN\n'+new Date().toLocaleDateString('es-CO')+'\n\n';
SEC.forEach(function(sec){o+='== '+sec.t.toUpperCase()+' ==\n';sec.q.forEach(function(q){n++;o+='\n'+n+'. '+q.t+'\n'+(ans(q)||'(sin respuesta)')+'\n'});o+='\n'});return o.trim()}
function build(){var n=0,p=document.getElementById('print');
p.innerHTML='<div class="ph"><img class="pp" src="'+VAN+'" alt="">'+LOGO+'<h1>Investigación del cliente · Vans · Video Halloween</h1><p>Dolores, objeciones e ideas de nuestro equipo comercial</p></div>'+
'<div class="pm"><div><b>Nombre</b>'+esc(S.nombre||'-')+'</div><div><b>Fecha</b>'+new Date().toLocaleDateString('es-CO')+'</div></div>'+
SEC.slice(1).map(function(sec){var x=SEC[0].q.length;return '<div class="ps'+(sec.fun?' fun':'')+'"><h2>'+sec.t+'</h2>'+sec.q.map(function(q){n++;var a=ans(q);return '<div class="pq"><b>'+(n+x)+'. '+q.t+'</b><p>'+(a?esc(a):'<i>Sin respuesta</i>')+'</p></div>'}).join('')+'</div>'}).join('')+'<div class="pf">Insumo para guion y contenido de video · DFSK</div>'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s)}
return new Promise(function(ok,no){var a=document.createElement('textarea');a.value=s;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():no()}catch(e){no()}document.body.removeChild(a)})}
document.addEventListener('click',function(e){var c=e.target.closest('[data-k],#pdf,#clr,#copy');if(!c)return;
if(c.dataset.k){var k=c.dataset.k,v=c.dataset.v,a=S[k]||[],i=a.indexOf(v);
if(c.dataset.one=='1'){a=i>-1?[]:[v];c.parentNode.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')})}else{i>-1?a.splice(i,1):a.push(v)}
S[k]=a;a.indexOf(v)>-1?c.classList.add('on'):c.classList.remove('on');save();prog()}
else if(c.id=='copy'){copyText(plain()).then(function(){toast('¡Respuestas copiadas! 📋')},function(){toast('No se pudo copiar, intenta de nuevo')})}
else if(c.id=='pdf'){build();window.print()}
else if(c.id=='clr'){if(confirm('¿Borrar todas las respuestas?')){S={};save();render();window.scrollTo(0,0)}}});
document.addEventListener('input',function(e){var t=e.target;
if(t.dataset.t){S[t.dataset.t]=t.value;save();prog()}
else if(t.dataset.r){S[t.dataset.r]=+t.value;var q=null;SEC.forEach(function(s){s.q.forEach(function(x){if(x.id==t.dataset.r)q=x})});document.getElementById('rv').textContent=rv(q);save();prog()}});
render();
</script></body></html>
